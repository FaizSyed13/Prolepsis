name: Release

# Push a tag like v1.0.0 and this makes a GitHub Release with a ready-to-download zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make the download zip
        run: git archive --format=zip --prefix=Prolepsis/ -o "Prolepsis-${GITHUB_REF_NAME}.zip" HEAD
      - name: Remove releases under the old name (Nextsight)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName,name --jq '.[] | select(.name | startswith("Nextsight")) | .tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "Prolepsis-${GITHUB_REF_NAME}.zip"
          --title "Prolepsis $GITHUB_REF_NAME"
          --notes-file .github/release-notes.md

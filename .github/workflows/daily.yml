name: Daily forecast

on:
  schedule:
    - cron: "0 23 * * 1-5"   # weekdays 23:00 UTC = 5 PM Saskatchewan, after US market close
  workflow_dispatch:          # "Run workflow" button for a manual update
  push:
    branches: [main]          # also rebuild whenever new code is uploaded

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Reuse downloaded prices, headlines and the FinBERT model
        uses: actions/cache@v4
        with:
          path: |
            data/*.pkl
            data/news.db
            ~/.cache/huggingface
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Build forecast page
        env:
          MADE_BY: GitHub Actions, daily
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

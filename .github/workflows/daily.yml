name: Daily forecast

on:
  schedule:
    - cron: "30 10 * * 1-5"  # weekdays 10:30 UTC = 5:30 AM New York: overnight news + futures for early risers
    - cron: "0 15 * * 1-5"   # weekdays 15:00 UTC = 10 AM New York: first half hour of trading
    - cron: "30 18 * * 1-5"  # weekdays 18:30 UTC = 1:30 PM New York: midday prices + news
    - cron: "0 23 * * 1-5"   # weekdays 23:00 UTC = 5 PM Saskatchewan, after US market close
    # Daytime runs log a forecast with the price so far; the 5 PM run replaces it with the closing price.
  workflow_dispatch:          # "Run workflow" button for a manual update
  push:
    branches: [main]          # also rebuild whenever new code is uploaded

permissions:
  contents: write   # save each day's forecast back into reports/forecast_log.csv
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install -r requirements.txt

      - name: Reuse downloaded prices, headlines and the FinBERT model
        uses: actions/cache@v5
        with:
          path: |
            data/*.pkl
            data/news.db
            ~/.cache/huggingface
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Build forecast page
        env:
          MADE_BY: GitHub Actions, daily
        run: python build_site.py

      - name: Save today's forecast for the scorecard
        # A save clash with another build must not stop the website from being published.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/forecast_log.csv
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -m "Daily forecast log [skip ci]"
          for try in 1 2 3; do   # another build or push may land at the same moment: retry
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((try * 10))
          done
          echo "::warning::Could not save the forecast log this time"; exit 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
